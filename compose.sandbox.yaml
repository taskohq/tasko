# Sandbox-only override. The sandbox kernel lacks the iptables raw table
# required by Docker bridge networking, so this bypasses the bridge network.
services:
  postgres:
    network_mode: host
    ports: !reset []
    networks: !reset []

  redis:
    network_mode: host
    ports: !reset []
    networks: !reset []

  minio:
    network_mode: host
    ports: !reset []
    networks: !reset []

  minio-init:
    network_mode: host
    networks: !reset []
    environment:
      MC_HOST_tasko: http://tasko_minio_dev:tasko_minio_dev_only_change_me@127.0.0.1:9000
