name: tasko-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tasko
      POSTGRES_USER: tasko
      POSTGRES_PASSWORD: tasko_dev_only
    ports:
      - "127.0.0.1:54329:5432"
    networks:
      - tasko_internal
    volumes:
      - tasko_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasko -d tasko"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:63799:6379"
    networks:
      - tasko_internal
    volumes:
      - tasko_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: tasko_minio_dev
      MINIO_ROOT_PASSWORD: tasko_minio_dev_only_change_me
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    networks:
      - tasko_internal
    volumes:
      - tasko_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - tasko_internal
    environment:
      MC_HOST_tasko: http://tasko_minio_dev:tasko_minio_dev_only_change_me@minio:9000
    command: ["mb", "--ignore-existing", "tasko/tasko-dev"]

volumes:
  tasko_postgres_data:
  tasko_redis_data:
  tasko_minio_data:

networks:
  tasko_internal:
    driver: bridge
